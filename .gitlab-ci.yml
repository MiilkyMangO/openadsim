stages:
  - build
  - testing

include:
  # TODO: Switch back to main when feature/always-publish-helmfile-oci of openads-helm is merged
  - remote: https://raw.githubusercontent.com/openads-project/openads-helm/feature/always-publish-helmfile-oci/.gitlab-ci/reusable-helmfile-oci.yml
    inputs:
      openads-helm-ref: feature/always-publish-helmfile-oci # TODO: Remove when merged into main
      compose-file: docker-compose.yml
      include-env-file-in-bundle: true
      chart-map: deployment/chart-map.yaml
      profiles: carla,traffic,automated-testing,no-perception,planning
      output-dir: deployment/generated
      helmfile-entrypoint: deployment/helmfile.yaml
      bundle-dir: deployment
  - component: gitlab.ika.rwth-aachen.de/fb-fi/ops/distributed-testing/openadscale@openads
    inputs:
      scenario-search-pattern: scenario.generator/**/*.xosc
