environments:
  default:
    values:
      - ../generated/environments/services.yaml.gotmpl
---
releases:
  # NetworkPolicy to isolate ros-middleware-bridges in concurrent deployments
  - name: '{{ printf "%s-middleware-bridge-policy" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
    chart: charts/ros-middleware-bridge-network-policy
    condition: serviceEnabled.ros-middleware-bridge.enabled
    values:
      - values.yaml.gotmpl
